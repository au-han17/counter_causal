# R-12-full — Llama-3.1-8B, LongHealth (all 400), counter-causal (full), cache 9000
# Paper Table 2 target: n/a — anomaly probe, not a paper number
#
# Paper §: for long-context tasks (LongHealth, Qasper, LoCoMo) the task system
# prompt is kept frozen as sink tokens, for ALL strategies. It "consumes a small
# number of our J memory slots", which is what --auto_frozen does: frozen_size is
# read from the task system prompt and subtracted from cache_size.
# chunk_size left unset => cache_size//4 = 2250. The ledger does not specify it.
# recent_size omitted on purpose: build_hook applies the upstream defaults
# (0 for counter-causal variants, cache_size//2 for h2o), per README "Key arguments".
task: longhealth
model: meta-llama/Llama-3.1-8B-Instruct
dtype: float16
hook: counter_causal
cache_size: 9000
auto_frozen: true
seed: 0
