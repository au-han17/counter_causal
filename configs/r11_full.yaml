# R-11-full — Llama-3.1-8B, LongHealth (all 400), counter-causal (full), cache 8000
# Paper Table 2 target: n/a — anomaly probe, not a paper number
#
# OPEN QUESTION: --auto_frozen is NOT set here. The upstream README example uses it
# for longhealth, but auto_frozen subtracts frozen_size from cache_size, which would
# change the effective budget away from the 8000 the anomaly is defined at.
# Decide before running; whichever way, keep R-11 and R-12 consistent.
# chunk_size left unset => cache_size//4 = 2000. The ledger does not specify it.
# recent_size omitted on purpose: build_hook applies the upstream defaults
# (0 for counter-causal variants, cache_size//2 for h2o), per README "Key arguments".
task: longhealth
model: meta-llama/Llama-3.1-8B-Instruct
dtype: float16
hook: counter_causal
cache_size: 8000
seed: 0
